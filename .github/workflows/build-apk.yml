name: Build FieldReport Agent APK

on:
  push:
    branches: [main]
    paths:
      - 'Bridge/android-agent/**'
  workflow_dispatch:   # allow manual trigger from GitHub Actions UI

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create/update the release

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          cache-read-only: false

      - name: Build debug APK
        working-directory: Bridge/android-agent
        run: |
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log
          EXIT=${PIPESTATUS[0]}
          if [ $EXIT -ne 0 ]; then
            echo ""
            echo "=== BUILD ERRORS ==="
            grep -E "^e:|error:|FAILURE:|Caused by:|> Task" /tmp/build.log | tail -60
          fi
          exit $EXIT

      - name: Rename APK
        run: |
          cp Bridge/android-agent/app/build/outputs/apk/debug/app-debug.apk \
             FieldReport-Agent.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: FieldReport-Agent
          path: FieldReport-Agent.apk
          retention-days: 90

      - name: Create or update 'agent-latest' release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: agent-latest
          name: FieldReport Agent (latest build)
          body: |
            Auto-built from the latest `main` branch.

            **Install on DJI RC Pro Enterprise:**
            1. Download `FieldReport-Agent.apk`
            2. Copy to RC via USB or download directly in the RC's browser
            3. Enable "Unknown sources" in RC Settings → Security
            4. Open the file manager, tap the APK, install
            5. Open FieldReport Agent once — it auto-starts on every boot from then on
          files: FieldReport-Agent.apk
          make_latest: true
