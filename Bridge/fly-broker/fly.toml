app = 'fieldreport-mqtt'
primary_region = 'ams'
min_machines_running = 1

[build]

# HTTP/WebSocket service (port 8080)
# Serves: DJI Cloud API v2 HTTP endpoints + MQTT-over-WebSocket for iPhone
[[services]]
  internal_port = 8080
  protocol = 'tcp'

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [[services.ports]]
    port = 80
    handlers = ['http']

  [[services.ports]]
    port = 6789
    handlers = ['tls', 'http']

  [services.concurrency]
    type = 'connections'
    hard_limit = 100
    soft_limit = 50

# MQTT over TLS (port 8883)
[[services]]
  internal_port = 1883
  protocol = 'tcp'

  [[services.ports]]
    port = 8883
    handlers = ['tls']

  [[services.ports]]
    port = 1883

  [services.concurrency]
    type = 'connections'
    hard_limit = 100
    soft_limit = 50
